agents:
  - id: crm_intelligence_specialist
    description: CRM scores, stage evidence, roll-up, coverage, and deal backup.
    capabilities: [crm_score, stage_validation, rollup, coverage, backup]
    trigger_phrases: [crm score, stage validator, deal roll-up, pipeline coverage, backup deal]
  - id: activity_engagement_specialist
    description: Gong verbal calls plus calendar, email, and weekly engagement.
    capabilities: [verbal_calls, calendar, email, engagement, weekly_updates]
    trigger_phrases: [verbal call, customer activity, email engagement, weekly update]
  - id: rep_performance_specialist
    description: Workday productivity minima, actuals, Gong coaching, and manager oversight.
    capabilities: [productivity, expectations, coaching, oversight]
    trigger_phrases: [rep performance, reps need help, productivity, coaching, manager oversight]
  - id: forecast_modeling_specialist
    description: Quotas, pacing, conversion, Q+1/Q+2 forecasts, stagnation, and risk.
    capabilities: [quota, pacing, conversion, forecast, stagnation, risk]
    trigger_phrases: [forecast risk, q+1, q+2, future pipeline, stagnated, pacing]
  - id: knowledge_base_rag
    description: Approved Confluence policy, product, compensation, and competitive knowledge.
    capabilities: [policy, product, compensation, competitive, commercial_rules]
    trigger_phrases: [policy, discount, commission, spif, battlecard, rules of engagement]
